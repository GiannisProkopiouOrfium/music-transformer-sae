# Music Flamingo Evaluation Configuration
# Centralized settings for dual steering perceptual evaluation

# Paths
paths:
  # Base directory containing all experimental data
  data_root: "flamingo_exp"

  # Output directory for prepared audio and results
  output_root: "flamingo_eval"

  # Encoding file for token decoding
  encoding_file: "../data/sod/processed/notes/encoding.json"

  # Model checkpoint (if needed for re-generation)
  model_checkpoint: "exp/sod/checkpoints/best_model.pt"

# Ground truth metrics for degradation calculation
ground_truth:
  pitch_class_entropy: 2.974
  scale_consistency: 92.26
  groove_consistency: 93.05

# Sample selection
sample_selection:
  # Method: "best_degradation", "random", "all"
  method: "best_degradation"

  # For dual unconditional: which baseline sample to use consistently
  # Options: "num_0", "num_1", "num_2", "best_degradation"
  baseline_sample: "num_0" # Use sample_alpha_p0.0_d0.0_num_0.npy

# Music Flamingo evaluation settings
music_flamingo:
  # API method: "gradio" or "transformers"
  # - gradio: Uses HuggingFace Spaces API (no GPU needed, but has quota limits)
  # - transformers: Local inference (requires GPU, downloads ~10GB model)
  api_method: "transformers"

  # HuggingFace token (optional)
  # - For gradio: Higher priority in queue, increased quota
  # - For transformers: Only needed for private models or if you hit download rate limits
  # Get token from: https://huggingface.co/settings/tokens
  hf_token: ""

  # Number of independent runs per sample (for self-consistency)
  num_runs: 3

  # Majority voting threshold (2 out of 3 for agreement)
  voting_threshold: 2

  # Model settings (adjust based on your Music Flamingo setup)
  model_name: "nvidia/music-flamingo-large"
  device: "cuda:0"
  temperature: 0.1 # Low temperature for consistency
  top_p: 0.9
  max_tokens: 256

# Prompts for each category
prompts:
  # Category I: Unconditional Single Steering
  category_1_pitch:
    system: "You are an expert music analyst. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece and analyze its pitch characteristics.

      <think>
      First, consider:
      - What is the overall pitch register (low bass, mid-range, or high treble)?
      - In MIDI note numbers, low pitch is around 60 (middle C), high pitch is around 68 (G# above middle C)
      - Most notes below 60 = low register, around 60-64 = mid register, above 64 = high register
      </think>

      On a scale from 1 to 5, rate the overall pitch register of this music:
      1 = Very low register (most notes below MIDI 60 / middle C)
      2 = Low-to-mid register (notes around MIDI 60-62)
      3 = Mid register (notes around MIDI 62-65)
      4 = Mid-to-high register (notes around MIDI 65-67)
      5 = Very high register (most notes above MIDI 67)

      IMPORTANT: Provide a brief justification first, then end your response with the rating inside XML tags in this EXACT format:
      <answer>{"rating": "X"}</answer>
      Where X is a number from 1-5.
      Example: The music uses mostly mid-range notes around MIDI 63-64. <answer>{"rating": "3"}</answer>

    # Parse regex: Extract rating from XML-tagged JSON format
    parse_regex: '<answer>\s*\{\s*"rating"\s*:\s*"(\d)"\s*\}\s*</answer>'

  category_1_duration:
    system: "You are an expert music analyst. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece and analyze its note duration characteristics.

      <think>
      First, consider:
      - Are the notes short and detached (staccato) or long and sustained (legato)?
      - In beats, short notes are around 6.5 beats or less, long notes are around 14.5 beats or more
      - Focus on how long notes are held, not the tempo
      </think>

      On a scale from 1 to 5, rate the average note duration in this music:
      1 = Very short notes (around 6.5 beats or less, rapid and detached)
      2 = Short-to-moderate notes (around 8-10 beats)
      3 = Moderate note lengths (around 10-12 beats, balanced articulation)
      4 = Moderate-to-long notes (around 12-14 beats)
      5 = Very long, sustained notes (around 14.5 beats or more, legato)

      IMPORTANT: Provide a brief justification first, then end your response with the rating inside XML tags in this EXACT format:
      <answer>{"rating": "X"}</answer>
      Where X is a number from 1-5.
      Example: Notes are moderately sustained around 11 beats with balanced articulation. <answer>{"rating": "3"}</answer>

    parse_regex: '<answer>\s*\{\s*"rating"\s*:\s*"(\d)"\s*\}\s*</answer>'

  # Category II: Unconditional Dual Steering
  category_2_dual:
    system: "You are an expert music analyst. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece and analyze TWO characteristics independently:

      <think>
      For PITCH:
      - What is the overall pitch register (low bass, mid-range, or high treble)?

      For DURATION:
      - Are notes short and detached (staccato) or long and sustained (legato)?

      Evaluate these two aspects separately without letting one influence the other.
      </think>

      Rate BOTH of the following on a 1-5 scale:

      A) PITCH REGISTER:
      1 = Very low register (most notes below MIDI 60 / middle C)
      2 = Low-to-mid register (notes around MIDI 60-62)
      3 = Mid register (notes around MIDI 62-65)
      4 = Mid-to-high register (notes around MIDI 65-67)
      5 = Very high register (most notes above MIDI 67)

      B) NOTE DURATION:
      1 = Very short notes (around 6.5 beats or less, rapid and detached)
      2 = Short-to-moderate notes (around 8-10 beats)
      3 = Moderate note lengths (around 10-12 beats, balanced articulation)
      4 = Moderate-to-long notes (around 12-14 beats)
      5 = Very long, sustained notes (around 14.5 beats or more, legato)

      IMPORTANT: Provide brief justification for each, then end your response with ratings inside XML tags in this EXACT format:
      <answer>{"pitch": "X", "duration": "Y"}</answer>
      Where X and Y are numbers from 1-5.
      Example: The pitch is in mid-range around MIDI 63. Notes are sustained around 13 beats. <answer>{"pitch": "3", "duration": "4"}</answer>

    parse_pitch_regex: '<answer>\s*\{[^}]*"pitch"\s*:\s*"(\d)"[^}]*\}\s*</answer>'
    parse_duration_regex: '<answer>\s*\{[^}]*"duration"\s*:\s*"(\d)"[^}]*\}\s*</answer>'

  # Category III: Conditional Single Steering
  category_3_pitch:
    system: "You are an expert music analyst. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece which has two distinct sections: an introduction and a main body.

      <think>
      Compare the pitch register between:
      - Introduction (first ~8 seconds / first musical phrase)
      - Main body (remaining majority of the piece)

      Did the overall pitch register increase, decrease, or stay roughly the same?
      Consider the average pitch across all instruments in each section.
      </think>

      Identify the direction of pitch change from introduction to main body:
      - "UP" if the main body has higher pitch than the introduction (e.g., shifted from MIDI 60 to 65)
      - "DOWN" if the main body has lower pitch than the introduction (e.g., shifted from MIDI 65 to 60)
      - "CONSTANT" if the pitch register stayed roughly the same (within 2-3 MIDI notes)

      IMPORTANT: Provide brief justification first, then end your response inside XML tags in this EXACT format:
      <answer>{"direction": "UP/DOWN/CONSTANT", "confidence": "HIGH/MEDIUM/LOW"}</answer>
      Example: The intro uses notes around MIDI 60-62, main body shifts to MIDI 64-66. <answer>{"direction": "UP", "confidence": "HIGH"}</answer>

    parse_regex: '<answer>\s*\{[^}]*"direction"\s*:\s*"(UP|DOWN|CONSTANT)"[^}]*\}\s*</answer>'
    parse_confidence_regex: '<answer>\s*\{[^}]*"confidence"\s*:\s*"(HIGH|MEDIUM|LOW)"[^}]*\}\s*</answer>'

  category_3_duration:
    system: "You are an expert music analyst. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece which has two distinct sections: an introduction and a main body.

      <think>
      Compare the note duration between:
      - Introduction (first ~8 seconds / first musical phrase)
      - Main body (remaining majority of the piece)

      Did the notes become longer (more sustained), shorter (more staccato), or stay similar?
      Focus on articulation changes, not tempo.
      </think>

      Identify the direction of duration change from introduction to main body:
      - "LONGER" if the main body has more sustained notes (e.g., from 8 beats to 13 beats)
      - "SHORTER" if the main body has shorter notes (e.g., from 13 beats to 8 beats)
      - "CONSTANT" if note durations stayed roughly the same (within 2-3 beats)

      IMPORTANT: Provide brief justification first, then end your response inside XML tags in this EXACT format:
      <answer>{"direction": "LONGER/SHORTER/CONSTANT", "confidence": "HIGH/MEDIUM/LOW"}</answer>
      Example: Intro has staccato notes around 7 beats, main body becomes more legato around 12 beats. <answer>{"direction": "LONGER", "confidence": "MEDIUM"}</answer>

    parse_regex: '<answer>\s*\{[^}]*"direction"\s*:\s*"(LONGER|SHORTER|CONSTANT)"[^}]*\}\s*</answer>'
    parse_confidence_regex: '<answer>\s*\{[^}]*"confidence"\s*:\s*"(HIGH|MEDIUM|LOW)"[^}]*\}\s*</answer>'

  # Category IV: Conditional Dual Steering
  category_4_dual:
    system: "You are an expert music analyst. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece which has two distinct sections: an introduction and a main body.

      <think>
      Compare TWO characteristics between the introduction and main body:

      1. PITCH REGISTER: Did it go up, down, or stay constant?
      2. NOTE DURATION: Did notes become longer, shorter, or stay constant?

      Evaluate these changes independently.
      </think>

      Identify the direction of change for BOTH characteristics:

      A) PITCH CHANGE (introduction → main body):
      - "UP" / "DOWN" / "CONSTANT"

      B) DURATION CHANGE (introduction → main body):
      - "LONGER" / "SHORTER" / "CONSTANT"

      IMPORTANT: Provide brief justification for each change, then end your response inside XML tags in this EXACT format:
      <answer>{"pitch_direction": "UP/DOWN/CONSTANT", "duration_direction": "LONGER/SHORTER/CONSTANT", "pitch_confidence": "HIGH/MEDIUM/LOW", "duration_confidence": "HIGH/MEDIUM/LOW"}</answer>
      Example: Intro uses MIDI 60-62 with 8-beat notes, main body shifts to MIDI 65-67 with 13-beat sustained notes. <answer>{"pitch_direction": "UP", "duration_direction": "LONGER", "pitch_confidence": "HIGH", "duration_confidence": "MEDIUM"}</answer>

    parse_pitch_regex: '<answer>\s*\{[^}]*"pitch_direction"\s*:\s*"(UP|DOWN|CONSTANT)"[^}]*\}\s*</answer>'
    parse_duration_regex: '<answer>\s*\{[^}]*"duration_direction"\s*:\s*"(LONGER|SHORTER|CONSTANT)"[^}]*\}\s*</answer>'
    parse_pitch_confidence_regex: '<answer>\s*\{[^}]*"pitch_confidence"\s*:\s*"(HIGH|MEDIUM|LOW)"[^}]*\}\s*</answer>'
    parse_duration_confidence_regex: '<answer>\s*\{[^}]*"duration_confidence"\s*:\s*"(HIGH|MEDIUM|LOW)"[^}]*\}\s*</answer>'

# Statistical analysis settings
analysis:
  # Significance level
  alpha: 0.05

  # Multiple comparison correction method
  # Options: "fdr_bh" (Benjamini-Hochberg), "bonferroni", "none"
  correction_method: "fdr_bh"

  # Minimum correlation for "strong" effect (for interpretation)
  strong_correlation_threshold: 0.7

  # Cohen's d thresholds
  cohens_d_thresholds:
    small: 0.2
    medium: 0.5
    large: 0.8

# Output formats
output:
  # Save detailed per-sample results
  save_detailed: true

  # Generate LaTeX tables
  generate_latex: true

  # Generate figures
  generate_figures: true

  # Figure format
  figure_format: "pdf" # or "png"

  # DPI for raster figures
  figure_dpi: 300

# Logging
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  save_to_file: true
  log_file: "flamingo_eval/evaluation.log"

# Category-specific settings
categories:
  # Category I: Unconditional Single
  category_1:
    enabled: true
    concepts: ["pitch", "duration"]
    # Alpha values to evaluate (must exist in data)
    alphas: [-1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5]
    # Metrics to calculate
    metrics:
      - "directional_success_rate" # % where sign(α) matches direction
      - "spearman_correlation" # α vs. rating correlation

  # Category II: Unconditional Dual
  category_2:
    enabled: true
    scenarios: ["low_long", "low_short", "high_long", "high_short", "baseline"]
    # Alpha combinations to evaluate (auto-detected from data)
    metrics:
      - "dual_directional_success_rate" # Both concepts correct
      - "spearman_correlation_pitch" # α_pitch vs. pitch rating
      - "spearman_correlation_duration" # α_duration vs. duration rating

  # Category III: Conditional Single
  category_3:
    enabled: true
    concepts: ["pitch", "duration"]
    # Override directions to evaluate
    override_types:
      pitch: ["high_to_low", "low_to_high"]
      duration: ["high_to_low", "low_to_high"]
    # Alphas per override direction
    alphas: [-1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5]
    metrics:
      - "override_success_rate" # OSR: % where change detected correctly
      - "alpha_response_correlation" # Stronger α → more detectable change?

  # Category IV: Conditional Dual
  category_4:
    enabled: true
    # Use pre-selected best examples from listening_samples
    use_listening_samples: true
    scenarios:
      - "high_pitch_short_duration_to_low_long"
      - "high_pitch_long_duration_to_low_short"
      - "low_pitch_short_duration_to_high_long"
      - "low_pitch_long_duration_to_high_short"
    metrics:
      - "dual_override_success_rate" # Dual-OSR: Both changes detected
      - "pitch_override_success_rate"
      - "duration_override_success_rate"

# Resume/checkpoint settings
resume:
  # Enable resuming from partial results
  enabled: true

  # Checkpoint file
  checkpoint_file: "flamingo_eval/evaluation_checkpoint.json"

  # Save checkpoint every N samples
  checkpoint_interval: 10
