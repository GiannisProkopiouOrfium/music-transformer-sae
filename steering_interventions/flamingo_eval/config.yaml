# Music Flamingo Evaluation Configuration
# Centralized settings for dual steering perceptual evaluation

# Paths
paths:
  # Base directory containing all experimental data
  data_root: "flamingo_exp"

  # Output directory for prepared audio and results
  output_root: "flamingo_eval"

  # Encoding file for token decoding
  encoding_file: "../data/sod/processed/notes/encoding.json"

  # Model checkpoint (if needed for re-generation)
  model_checkpoint: "exp/sod/checkpoints/best_model.pt"

# Ground truth metrics for degradation calculation
ground_truth:
  pitch_class_entropy: 2.974
  scale_consistency: 92.26
  groove_consistency: 93.05

# Sample selection
sample_selection:
  # Method: "best_degradation", "random", "all"
  method: "best_degradation"

  # For dual unconditional: which baseline sample to use consistently
  # Options: "num_0", "num_1", "num_2", "best_degradation"
  baseline_sample: "num_0" # Use sample_alpha_p0.0_d0.0_num_0.npy

# Music Flamingo evaluation settings
music_flamingo:
  # API method: "gradio" or "transformers"
  # - gradio: Uses HuggingFace Spaces API (no GPU needed, but has quota limits)
  # - transformers: Local inference (requires GPU, downloads ~10GB model)
  api_method: "transformers"

  # HuggingFace token (optional)
  # - For gradio: Higher priority in queue, increased quota
  # - For transformers: Only needed for private models or if you hit download rate limits
  # Get token from: https://huggingface.co/settings/tokens
  hf_token: ""

  # Number of independent runs per sample (for self-consistency)
  num_runs: 1

  # Majority voting threshold (1 out of 1 for single run)
  voting_threshold: 1

  # Model settings (adjust based on your Music Flamingo setup)
  model_name: "nvidia/music-flamingo-hf"
  device: "cuda:0"
  temperature: 0.1 # Zero temperature for perfect consistency
  top_p: 0.9
  max_tokens: 256 # Enough for brief reasoning + XML tags

# Prompts for each category
prompts:
  # Category I: Unconditional Single Steering
  # (B) Low-to-mid average note pitch (notes around MIDI 60-62)
  # (D) Mid-to-high average note pitch (notes around MIDI 65-67)

  category_1_pitch:
    system: "You are an expert music analyst. Answer the question about the audio."

    user_template: |
      How would the overall average note pitch of this audio be described? Choose the correct option from the following options:
      (A) Low average note pitch (notes less than MIDI 62-65)
      (B) Mid average note pitch (notes around MIDI 62-65)
      (C) High average note pitch (notes greater than MIDI 62-65)

    parse_regex: '\(([A-C])\)'

  category_1_duration:
    system: "You are an expert music analyst. Answer the question about the audio."

    user_template: |
      How would the average note duration in this audio be described? Choose the correct option from the following options:
      (A) Short average note duration (notes less than 10 MIDI beats)
      (B) Moderate average note duration (notes around 10-12 MIDI beats)
      (C) Long average note duration (notes more than 12 MIDI beats)

    parse_regex: '\(([A-C])\)'

  # Category II: Unconditional Dual Steering
  category_2_dual:
    system: "You are an expert music analyst. Answer the question about the audio."

    user_template: |
      How would you describe the overall average note pitch AND average note duration of this audio? Choose the correct option from the following options:
      (A) Low average note pitch (notes lower than MIDI 62) and Short average note duration (notes less than MIDI 10 beats)
      (B) Low average note pitch (notes lower than MIDI 62) and Long average note duration (notes more than 12 MIDI beats)
      (C) Mid average note pitch (notes around MIDI 62-65) and Moderate average note duration (notes around 10-12 MIDI beats)
      (D) High average note pitch (notes higher than MIDI 65) and Short average note duration (notes less than MIDI 10 beats)
      (E) High average note pitch (notes higher than MIDI 65) and Long average note duration (notes more than 12 MIDI beats)
    parse_regex: '\(([A-E])\)'

  # Category III: Conditional Single Steering
  category_3_pitch:
    system: "You are an expert music analyst. Answer the question about the audio."

    user_template: |
      Compare the average note pitch between the introduction (first ~10 seconds) and the main body (rest of the piece). Which best describes the pitch direction? Choose the correct option from the following options:
      (A) UP - The introduction has lower average pitch, the main body has higher average pitch
      (B) DOWN - The introduction has higher average pitch, the main body has lower average pitch
      (C) CONSTANT - The average pitch remains similar throughout

    parse_regex: '\(([A-C])\)'

  category_3_duration:
    system: "You are an expert music analyst. Answer the question about the audio."

    user_template: |
      Compare the average note duration between the introduction (first ~10 seconds) and the main body (rest of the piece). Which best describes the duration direction? Choose the correct option from the following options:
      (A) LONGER - The main body has longer, more sustained notes than the introduction
      (B) SHORTER - The main body has shorter, more staccato notes than the introduction
      (C) CONSTANT - The average note duration remains similar throughout

    parse_regex: '\(([A-C])\)'

  # Category IV: Conditional Dual Steering
  category_4_dual:
    system: "You are an expert music analyst. Answer the question about the audio."

    user_template: |
      Compare the introduction (first ~10 seconds) with the main body (rest of the piece). How do BOTH the average note pitch AND average note duration change? Choose the correct option from the following options:
      (A) Average note pitch goes higher and average note duration becomes longer
      (B) Average note pitch goes higher and average note duration becomes shorter
      (C) Average note pitch stays constant and average note duration stays constant
      (D) Average note pitch goes lower and average note duration becomes shorter
      (E) Average note pitch goes lower and average note duration becomes longer
    parse_regex: '\(([A-E])\)'

# Statistical analysis settings
analysis:
  # Significance level
  alpha: 0.05

  # Multiple comparison correction method
  # Options: "fdr_bh" (Benjamini-Hochberg), "bonferroni", "none"
  correction_method: "fdr_bh"

  # Minimum correlation for "strong" effect (for interpretation)
  strong_correlation_threshold: 0.7

  # Cohen's d thresholds
  cohens_d_thresholds:
    small: 0.2
    medium: 0.5
    large: 0.8

# Output formats
output:
  # Save detailed per-sample results
  save_detailed: true

  # Generate LaTeX tables
  generate_latex: true

  # Generate figures
  generate_figures: true

  # Figure format
  figure_format: "pdf" # or "png"

  # DPI for raster figures
  figure_dpi: 300

# Logging
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  save_to_file: true
  log_file: "flamingo_eval/evaluation.log"

# Category-specific settings
categories:
  # Category I: Unconditional Single
  category_1:
    enabled: true
    concepts: ["pitch", "duration"]
    # Alpha values to evaluate (must exist in data)
    alphas: [-1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5]
    # Metrics to calculate
    metrics:
      - "directional_success_rate" # % where sign(α) matches direction
      - "spearman_correlation" # α vs. rating correlation

  # Category II: Unconditional Dual
  category_2:
    enabled: true
    scenarios: ["low_long", "low_short", "high_long", "high_short", "baseline"]
    # Alpha combinations to evaluate (auto-detected from data)
    metrics:
      - "dual_directional_success_rate" # Both concepts correct
      - "spearman_correlation_pitch" # α_pitch vs. pitch rating
      - "spearman_correlation_duration" # α_duration vs. duration rating

  # Category III: Conditional Single
  category_3:
    enabled: true
    concepts: ["pitch", "duration"]
    # Override directions to evaluate
    override_types:
      pitch: ["high_to_low", "low_to_high"]
      duration: ["high_to_low", "low_to_high"]
    # Alphas per override direction
    alphas: [-1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5]
    metrics:
      - "override_success_rate" # OSR: % where change detected correctly
      - "alpha_response_correlation" # Stronger α → more detectable change?

  # Category IV: Conditional Dual
  category_4:
    enabled: true
    # Use pre-selected best examples from listening_samples
    use_listening_samples: true
    scenarios:
      - "high_pitch_short_duration_to_low_long"
      - "high_pitch_long_duration_to_low_short"
      - "low_pitch_short_duration_to_high_long"
      - "low_pitch_long_duration_to_high_short"
    metrics:
      - "dual_override_success_rate" # Dual-OSR: Both changes detected
      - "pitch_override_success_rate"
      - "duration_override_success_rate"

# Resume/checkpoint settings
resume:
  # Enable resuming from partial results
  enabled: true

  # Checkpoint file
  checkpoint_file: "flamingo_eval/evaluation_checkpoint.json"

  # Save checkpoint every N samples
  checkpoint_interval: 10
