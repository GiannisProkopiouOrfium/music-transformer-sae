# Music Flamingo Evaluation Configuration
# Centralized settings for dual steering perceptual evaluation

# Paths
paths:
  # Base directory containing all experimental data
  data_root: "flamingo_exp"

  # Output directory for prepared audio and results
  output_root: "flamingo_eval"

  # Encoding file for token decoding
  encoding_file: "../data/sod/processed/notes/encoding.json"

  # Model checkpoint (if needed for re-generation)
  model_checkpoint: "exp/sod/checkpoints/best_model.pt"

# Ground truth metrics for degradation calculation
ground_truth:
  pitch_class_entropy: 2.974
  scale_consistency: 92.26
  groove_consistency: 93.05

# Sample selection
sample_selection:
  # Method: "best_degradation", "random", "all"
  method: "best_degradation"

  # For dual unconditional: which baseline sample to use consistently
  # Options: "num_0", "num_1", "num_2", "best_degradation"
  baseline_sample: "num_0" # Use sample_alpha_p0.0_d0.0_num_0.npy

# Music Flamingo evaluation settings
music_flamingo:
  # API method: "gradio" or "transformers"
  # - gradio: Uses HuggingFace Spaces API (no GPU needed, but has quota limits)
  # - transformers: Local inference (requires GPU, downloads ~10GB model)
  api_method: "transformers"

  # HuggingFace token (optional)
  # - For gradio: Higher priority in queue, increased quota
  # - For transformers: Only needed for private models or if you hit download rate limits
  # Get token from: https://huggingface.co/settings/tokens
  hf_token: ""

  # Number of independent runs per sample (for self-consistency)
  num_runs: 3

  # Majority voting threshold (2 out of 3 for agreement)
  voting_threshold: 2

  # Model settings (adjust based on your Music Flamingo setup)
  model_name: "nvidia/music-flamingo-hf"
  device: "cuda:0"
  temperature: 0.1 # Zero temperature for perfect consistency
  top_p: 0.9
  max_tokens: 256 # Enough for brief reasoning + XML tags

# Prompts for each category
prompts:
  # Category I: Unconditional Single Steering
  category_1_pitch:
    system: "You are an expert music analyst with focus on average note pitch. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece and analyze its average note pitch characteristics.

      <think>
      First, consider:
      - What is the overall/average pitch of the notes (low bass, mid-range, or high treble)?
      - In MIDI note numbers, low pitch is around 60 (middle C), high pitch is around 68 (G# above middle C)
      - Most notes below 60 = low register, around 60-64 = mid register, above 64 = high register
      </think>

      On a scale from 1 to 5, rate the overall pitch register of this music:
      1 = Very low average note pitch (most notes below MIDI 60 / middle C)
      2 = Low-to-mid average note pitch (notes around MIDI 60-62)
      3 = Mid average note pitch (notes around MIDI 62-65)
      4 = Mid-to-high average note pitch (notes around MIDI 65-67)
      5 = Very high average note pitch (most notes above MIDI 67)

      CRITICAL FORMAT REQUIREMENT:
      You MUST end your response with this exact XML format:
      <answer>{"average_note_pitch": "X"}</answer>
      where X is your rating (1-5).

      Provide brief reasoning (one sentence)  before the tags, but the XML tags are MANDATORY.
      Example: Notes center average around MIDI 63-64 in the mid register. <answer>{"average_note_pitch": "3"}</answer>
    # Parse regex: Extract rating from XML-tagged JSON format
    parse_regex: '<answer>\s*\{\s*"average_note_pitch"\s*:\s*"(\d)"\s*\}\s*</answer>'

  category_1_duration:
    system: "You are an expert music analyst with focus on average note duration. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece and analyze its average note duration characteristics.

      <think>
      First, consider:
      - Are the notes duration short and detached (staccato) or long and sustained (legato)?
      - In beats, short notes are around 6.5 beats or less, long notes are around 14.5 beats or more
      - Focus on how long notes are held, not the tempo
      </think>

      On a scale from 1 to 5, rate the average note duration in this music:
      1 = Very short average note duration (around 6.5 beats or less, rapid and detached)
      2 = Short-to-moderate average note duration (around 8-10 beats)
      3 = Moderate average note duration (around 10-12 beats, balanced articulation)
      4 = Moderate-to-long average note duration (around 12-14 beats)
      5 = Very long, sustained average note duration (around 14.5 beats or more, legato)

      CRITICAL FORMAT REQUIREMENT:
      You MUST end your response with this exact XML format:
      <answer>{"average_note_duration": "X"}</answer>
      where X is your rating (1-5).

      Provide brief reasoning (one sentence) before the tags, but the XML tags are MANDATORY.
      Example: Note duration average is around 11 beats with balanced articulation. <answer>{"average_note_duration": "3"}</answer>
    parse_regex: '<answer>\s*\{\s*"average_note_duration"\s*:\s*"(\d)"\s*\}\s*</answer>'

  # Category II: Unconditional Dual Steering
  category_2_dual:
    system: "You are an expert music analyst with focus on average note pitch and average note duration. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece and analyze TWO characteristics independently:

      <think>
      For average note PITCH:
      - What is the overall/average pitch of the notes (low bass, mid-range, or high treble)?
      - In MIDI note numbers, low pitch is around 60 (middle C), high pitch is around 68 (G# above middle C)
      - Most notes below 60 = low register, around 60-64 = mid register, above 64 = high register

      For average note DURATION:
      - Are the notes duration short and detached (staccato) or long and sustained (legato)?
      - In beats, short notes are around 6.5 beats or less, long notes are around 14.5 beats or more
      - Focus on how long notes are held, not the tempo

      Evaluate these two aspects separately without letting one influence the other.
      </think>

      Rate BOTH of the following on a 1-5 scale:

      A) average note PITCH:
      On a scale from 1 to 5, rate the overall pitch register of this music:
      1 = Very low average note pitch (most notes below MIDI 60 / middle C)
      2 = Low-to-mid average note pitch (notes around MIDI 60-62)
      3 = Mid average note pitch (notes around MIDI 62-65)
      4 = Mid-to-high average note pitch (notes around MIDI 65-67)
      5 = Very high average note pitch (most notes above MIDI 67)

      B) average note DURATION:
      On a scale from 1 to 5, rate the average note duration in this music:
      1 = Very short average note duration (around 6.5 beats or less, rapid and detached)
      2 = Short-to-moderate average note duration (around 8-10 beats)
      3 = Moderate average note duration (around 10-12 beats, balanced articulation)
      4 = Moderate-to-long average note duration (around 12-14 beats)
      5 = Very long, sustained average note duration (around 14.5 beats or more, legato)

      CRITICAL FORMAT REQUIREMENT:
      You MUST end your response with this exact XML format:
      <answer>{"average_note_pitch": "X", "average_note_duration": "Y"}</answer>
      where X and Y are your ratings (1-5).

      Provide brief reasoning (one sentence) before the tags, but the XML tags are MANDATORY.
      Example: Pitch centers around MIDI 66 (mid-high), notes sustained 12-13 beats. <answer>{"average_note_pitch": "2", "average_note_duration": "4"}</answer>
    parse_pitch_regex: '<answer>\s*\{[^}]*"average_note_pitch"\s*:\s*"(\d)"[^}]*\}\s*</answer>'
    parse_duration_regex: '<answer>\s*\{[^}]*"average_note_duration"\s*:\s*"(\d)"[^}]*\}\s*</answer>'

  # Category III: Conditional Single Steering
  category_3_pitch:
    system: "You are an expert music analyst with focus on average note pitch comparison. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece with two sections: introduction (~10 seconds) and main body.

      REQUIRED OUTPUT FORMAT - Use this exact structure in the end after your reasoning (one sentence):
      <answer>{"average_note_pitch_direction": "UP/DOWN/CONSTANT"}</answer>

      Task: Compare average note pitch between introduction and main body.
      - "UP" = main body higher than intro (e.g., MIDI 60→65)
      - "DOWN" = main body lower than intro (e.g., MIDI 65→60)
      - "CONSTANT" = stayed similar (within 2-3 MIDI notes)

      Reference: MIDI 60=middle C (low), MIDI 68=G# above C (high)
      Example: The introduction's average note pitch is around MIDI 61 (low), while the main body centers around MIDI 66 (higher). <answer>{"average_note_pitch_direction": "UP"}</answer>

    parse_regex: '<answer>\s*\{[^}]*"average_note_pitch_direction"\s*:\s*"(UP|DOWN|CONSTANT)"[^}]*\}\s*</answer>'

  category_3_duration:
    system: "You are an expert music analyst with focus on average note duration comparison. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece with two sections: introduction (~10 seconds) and main body.

      REQUIRED OUTPUT FORMAT - Use this exact structure in the end after your reasoning (one sentence):
      <answer>{"average_note_duration_direction": "LONGER/SHORTER/CONSTANT"}</answer>

      Task: Compare average note duration between introduction and main body.
      - "LONGER" = main body more sustained (e.g., 8 beats→13 beats)
      - "SHORTER" = main body more staccato (e.g., 13 beats→8 beats)
      - "CONSTANT" = stayed similar (within 2-3 beats)

      Reference: 6.5 beats (short/staccato), 14.5 beats (long/legato)
      Focus on average note duration, not tempo.
      Example: The introduction's average note duration is around 9 beats (moderate), while the main body averages around 14 beats (longer). <answer>{"average_note_duration_direction": "LONGER"}</answer>

    parse_regex: '<answer>\s*\{[^}]*"average_note_duration_direction"\s*:\s*"(LONGER|SHORTER|CONSTANT)"[^}]*\}\s*</answer>'

  # Category IV: Conditional Dual Steering
  category_4_dual:
    system: "You are an expert music analyst with focus on average note pitch and duration comparison. Provide objective assessments of musical characteristics."

    user_template: |
      Listen to this musical piece which has two distinct sections: an introduction and a main body.
      Compare the note duration between:
      - Introduction (first ~10 seconds / first musical phrase)
      - Main body (remaining majority of the piece)

      <think>
      Listen to this musical piece and analyze TWO characteristics independently:

      For average note PITCH:
      - What is the overall/average pitch of the notes (low bass, mid-range, or high treble)?
      - In MIDI note numbers, low pitch is around 60 (middle C), high pitch is around 68 (G# above middle C)
      - Most notes below 60 = low register, around 60-64 = mid register, above 64 = high register

      For average note DURATION:
      - Are the notes duration short and detached (staccato) or long and sustained (legato)?
      - In beats, short notes are around 6.5 beats or less, long notes are around 14.5 beats or more
      - Focus on how long notes are held, not the tempo

      Evaluate these changes independently.
      </think>

      REQUIRED OUTPUT FORMAT - Use this exact structure (DO NOT describe in prose) after your reasoning (one sentence):
      <answer>{"average_note_pitch_direction": "UP/DOWN/CONSTANT", "average_note_duration_direction": "LONGER/SHORTER/CONSTANT"}</answer>

      Task: Compare TWO characteristics between introduction and main body:

      A) AVERAGE NOTE PITCH CHANGE:
      - "UP" = main body higher average note pitch than introduction (e.g., MIDI 60→65)
      - "DOWN" = main body lower average note pitch than introduction (e.g., MIDI 65→60)
      - "CONSTANT" = similar (within 2-3 MIDI notes)

      B) AVERAGE NOTE DURATION CHANGE:
      - "LONGER" = main body longer average note duration than introduction (e.g., 8→13 beats)
      - "SHORTER" = main body shorter average note duration than introduction (e.g., 13→8 beats)
      - "CONSTANT" = similar (within 2-3 beats)

      Example: The introduction's average note pitch is around MIDI 61 (low), while the main body centers around MIDI 66 (higher). The introduction's average note duration is around 9 beats (moderate), while the main body averages around 14 beats (longer). <answer>{"average_note_pitch_direction": "UP", "average_note_duration_direction": "LONGER"}</answer>

    parse_pitch_regex: '<answer>\s*\{[^}]*"average_note_pitch_direction"\s*:\s*"(UP|DOWN|CONSTANT)"[^}]*\}\s*</answer>'
    parse_duration_regex: '<answer>\s*\{[^}]*"average_note_duration_direction"\s*:\s*"(LONGER|SHORTER|CONSTANT)"[^}]*\}\s*</answer>'

# Statistical analysis settings
analysis:
  # Significance level
  alpha: 0.05

  # Multiple comparison correction method
  # Options: "fdr_bh" (Benjamini-Hochberg), "bonferroni", "none"
  correction_method: "fdr_bh"

  # Minimum correlation for "strong" effect (for interpretation)
  strong_correlation_threshold: 0.7

  # Cohen's d thresholds
  cohens_d_thresholds:
    small: 0.2
    medium: 0.5
    large: 0.8

# Output formats
output:
  # Save detailed per-sample results
  save_detailed: true

  # Generate LaTeX tables
  generate_latex: true

  # Generate figures
  generate_figures: true

  # Figure format
  figure_format: "pdf" # or "png"

  # DPI for raster figures
  figure_dpi: 300

# Logging
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  save_to_file: true
  log_file: "flamingo_eval/evaluation.log"

# Category-specific settings
categories:
  # Category I: Unconditional Single
  category_1:
    enabled: true
    concepts: ["pitch", "duration"]
    # Alpha values to evaluate (must exist in data)
    alphas: [-1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5]
    # Metrics to calculate
    metrics:
      - "directional_success_rate" # % where sign(α) matches direction
      - "spearman_correlation" # α vs. rating correlation

  # Category II: Unconditional Dual
  category_2:
    enabled: true
    scenarios: ["low_long", "low_short", "high_long", "high_short", "baseline"]
    # Alpha combinations to evaluate (auto-detected from data)
    metrics:
      - "dual_directional_success_rate" # Both concepts correct
      - "spearman_correlation_pitch" # α_pitch vs. pitch rating
      - "spearman_correlation_duration" # α_duration vs. duration rating

  # Category III: Conditional Single
  category_3:
    enabled: true
    concepts: ["pitch", "duration"]
    # Override directions to evaluate
    override_types:
      pitch: ["high_to_low", "low_to_high"]
      duration: ["high_to_low", "low_to_high"]
    # Alphas per override direction
    alphas: [-1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5]
    metrics:
      - "override_success_rate" # OSR: % where change detected correctly
      - "alpha_response_correlation" # Stronger α → more detectable change?

  # Category IV: Conditional Dual
  category_4:
    enabled: true
    # Use pre-selected best examples from listening_samples
    use_listening_samples: true
    scenarios:
      - "high_pitch_short_duration_to_low_long"
      - "high_pitch_long_duration_to_low_short"
      - "low_pitch_short_duration_to_high_long"
      - "low_pitch_long_duration_to_high_short"
    metrics:
      - "dual_override_success_rate" # Dual-OSR: Both changes detected
      - "pitch_override_success_rate"
      - "duration_override_success_rate"

# Resume/checkpoint settings
resume:
  # Enable resuming from partial results
  enabled: true

  # Checkpoint file
  checkpoint_file: "flamingo_eval/evaluation_checkpoint.json"

  # Save checkpoint every N samples
  checkpoint_interval: 10
