# Local Development Configuration
model:
  checkpoint_path: "./exp/sod/mmm/model.pt"
  layer_idx: 2

extraction:
  data_path: "./data/sod/processed"
  output_file: "activations_layer2.h5"
  batch_size: 8 # Smaller for local CPU/limited GPU
  max_samples: 10000 # Limited for development

training:
  hidden_dim: 2048
  l1_alpha: 0.001
  learning_rate: 0.001
  num_epochs: 20 # Fewer epochs for development
  batch_size: 16 # Smaller batch size
  val_split: 0.1
  save_every: 5
  weight_decay: 0.0001

analysis:
  sample_size: 1000 # Smaller sample for faster analysis
  top_features: 10
  visualization_dpi: 150
