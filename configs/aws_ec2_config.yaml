# AWS EC2 Configuration for SAE Analysis
model:
  checkpoint_path: "/home/ubuntu/mmt/exp/sod/mmm/checkpoints/mmm_sod.pt"
  hidden_size: 512
  num_layers: 12
  num_heads: 8
  max_seq_len: 1024
  vocab_size: 388

data:
  data_dir: "/home/ubuntu/mmt/data/sod/processed"
  version: "sod"
  representation: "mmm"

extraction:
  target_layer: 2
  batch_size: 32
  max_samples: 100000

sae:
  expansion_factor: 4.0
  sparsity_coeff: 0.001
  learning_rate: 0.001
  num_epochs: 100
  batch_size: 64

analysis:
  sample_size: 10000
  top_features: 20

# AWS EC2 Instance Configurations
ec2_instances:
  small: # g4dn.xlarge - 4 vCPUs, 16GB RAM, T4 GPU
    extraction:
      batch_size: 16
      max_samples: 50000
    training:
      batch_size: 32
      gradient_accumulation: 2

  medium: # g4dn.2xlarge - 8 vCPUs, 32GB RAM, T4 GPU
    extraction:
      batch_size: 32
      max_samples: 100000
    training:
      batch_size: 64
      gradient_accumulation: 1

  large: # p3.2xlarge - 8 vCPUs, 61GB RAM, V100 GPU
    extraction:
      batch_size: 64
      max_samples: null
    training:
      batch_size: 128
      gradient_accumulation: 1
